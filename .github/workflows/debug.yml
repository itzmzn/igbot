name: Mock browser diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and runner dependencies
        run: npx playwright install --with-deps chromium
      - name: Run mock tests with diagnostics enabled
        id: mock-tests
        continue-on-error: true
        env:
          DEBUG_ARTIFACTS: '1'
        shell: bash
        run: |
          mkdir -p artifacts/debug
          set +e
          npm test 2>&1 | tee artifacts/debug/test-failure-report.txt
          test_status=${PIPESTATUS[0]}
          exit "$test_status"
      - name: Validate mock account JSON
        if: steps.mock-tests.outcome == 'success'
        run: npm run validate:json -- artifacts/debug/mock-account.json
      - name: Upload sanitized screenshots, traces, and diagnostic summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: igbot-debug-${{ github.run_id }}
          path: artifacts/debug/
          if-no-files-found: ignore
          retention-days: 5
      - name: Fail the run if mock tests failed
        if: steps.mock-tests.outcome == 'failure'
        run: exit 1
