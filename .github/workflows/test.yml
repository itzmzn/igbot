name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and runner dependencies
        run: npx playwright install --with-deps chromium
      - name: Run unit and mock browser tests
        env:
          DEBUG_ARTIFACTS: '1'
        shell: bash
        run: |
          mkdir -p artifacts/debug
          set -o pipefail
          npm test 2>&1 | tee artifacts/debug/test-failure-report.txt
      - name: Validate generated mock account JSON
        run: npm run validate:json -- artifacts/debug/mock-account.json
      - name: Upload sanitized mock diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: igbot-test-debug
          path: artifacts/debug/
          if-no-files-found: ignore
          retention-days: 5
