name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve dependency lock on the hosted runner
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and runner dependencies
        run: npx playwright install --with-deps chromium
      - name: Check Mail.tm domain discovery without creating a mailbox
        id: mailtm-smoke
        continue-on-error: true
        run: node scripts/check-mailtm.js
      - name: Run unit and mock browser tests
        env:
          DEBUG_ARTIFACTS: '1'
        shell: bash
        run: |
          mkdir -p artifacts/debug
          set -o pipefail
          npm test 2>&1 | tee artifacts/debug/test-failure-report.txt
      - name: Validate generated mock account JSON
        run: npm run validate:json -- artifacts/debug/mock-account.json
      - name: Upload sanitized mock diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igbot-test-debug
          path: artifacts/debug/
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload generated dependency lock for repository lock-in
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igbot-generated-lock
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 2
